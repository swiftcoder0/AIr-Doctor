services:
  - type: web
    name: airdoctor-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://swiftcoder0.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_URL
        value: sqlite:///./airdoctor.db
